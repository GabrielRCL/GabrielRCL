name: Contribution count

# Writes the contribution count every hour and on every push to main: contributions.json for the
# site (gabrielrcl.dev reads it from raw.githubusercontent.com), published to the "output" branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The count is the one the profile graph shows (private contributions included, since the
      # profile is set to show them).
      - name: Contribution count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          total=$(gh api graphql -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { totalContributions } } } }' -f login="$LOGIN" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          python3 - "$total" <<'PY'
          import datetime
          import json
          import sys
          total = int(sys.argv[1])
          updated = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"total": total, "updated": updated}, open("dist/contributions.json", "w"))
          print("contributions:", total)
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
