name: Contribution snake

# Redraws the snake that eats the contribution graph, once a day and on every push to main.
# The SVGs are published to the "output" branch, which the README reads.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f87934
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f87934

      # The count the profile graph shows (private contributions included, since the profile shows them).
      - name: Contribution count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          total=$(gh api graphql -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { totalContributions } } } }' -f login="$LOGIN" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          python3 - "$total" <<'PY'
          import sys
          n = f"{int(sys.argv[1]):,}"
          font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="520" height="44" role="img" aria-label="' + n + ' contributions in the last year">'
              '<text x="0" y="31" font-family="' + font + '" font-size="26">'
              '<tspan fill="#F87934" font-weight="800">' + n + '</tspan>'
              '<tspan fill="#8B949E" font-size="18" dx="10">contributions in the last year · updated daily</tspan>'
              '</text></svg>'
          )
          open("dist/contributions.svg", "w").write(svg)
          print("contributions:", n)
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
